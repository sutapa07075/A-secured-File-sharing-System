<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="container">
    <div class="page-header">
      <h1>Your classes</h1>
      <button class="btn btn-accent" id="newClassBtn">Create class</button>
    </div>

    <div class="form-panel" id="newClassPanel" style="display:none;">
      <div class="form-row">
        <div>
          <label for="className">Class name</label>
          <input type="text" id="className" placeholder="e.g. Grade 10 - Section B">
        </div>
        <div>
          <label for="classSubject">Subject</label>
          <input type="text" id="classSubject" placeholder="e.g. Physics">
        </div>
      </div>
      <button class="btn btn-accent" id="createClassSubmit" style="margin-top:14px;">Create</button>
      <span id="createClassError" style="color:var(--error); font-size:13px; margin-left:10px;"></span>
    </div>

    <div class="grid" id="classGrid"></div>
  </div>

  <script src="/js/session-guard.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/teacher-dashboard.js"></script>
</body>
</html>
