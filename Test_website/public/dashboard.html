<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="container">
    <div class="page-header">
      <h1>Your classes</h1>
      <button class="btn btn-accent" id="joinBtn">Join a class</button>
    </div>

    <div class="form-panel" id="joinPanel" style="display:none;">
      <div class="form-row">
        <div>
          <label for="classCode">Class code</label>
          <input type="text" id="classCode" placeholder="e.g. K3F9QZ" style="text-transform:uppercase;">
        </div>
      </div>
      <button class="btn btn-accent" id="joinSubmit" style="margin-top:14px;">Join</button>
      <span id="joinError" style="color:var(--error); font-size:13px; margin-left:10px;"></span>
    </div>

    <div class="grid" id="classGrid"></div>

    <div class="page-header" style="margin-top:40px;">
      <h1>Upcoming tests</h1>
    </div>
    <div id="upcomingList"></div>
  </div>

  <script src="/js/session-guard.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
