<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Test</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="container">
    <div class="page-header">
      <div>
        <h1 id="testTitle">Loading…</h1>
        <p id="testMeta" style="font-family:-apple-system,sans-serif; font-size:13px; color:#8a8478; margin:4px 0 0;"></p>
      </div>
      <div id="timer" style="font-family:-apple-system,sans-serif; font-weight:700; font-size:18px;"></div>
    </div>

    <div id="statusBanner"></div>
    <div id="questionList"></div>
    <button class="btn btn-accent" id="submitBtn" style="margin-top:10px;">Submit test</button>
  </div>

  <script src="/js/session-guard.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/take-test.js"></script>
