<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="container">
    <div class="page-header">
      <div>
        <div class="tile-subject" id="classSubject" style="font-family:-apple-system,sans-serif;"></div>
        <h1 id="className">Loading…</h1>
      </div>
      <div id="teacherActions" style="display:none;">
        <button class="btn btn-accent" id="newTestBtn">Create test</button>
      </div>
    </div>
    <div id="classCodeNote"></div>

    <div class="form-panel" id="newTestPanel" style="display:none;">
      <div class="form-row">
        <div>
          <label for="testTitle">Title</label>
          <input type="text" id="testTitle" placeholder="e.g. Unit 3 Quiz">
        </div>
        <div>
          <label for="testDuration">Duration (minutes)</label>
          <input type="number" id="testDuration" value="30" min="5">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="testStart">Opens</label>
          <input type="datetime-local" id="testStart">
        </div>
        <div>
          <label for="testEnd">Closes</label>
          <input type="datetime-local" id="testEnd">
        </div>
      </div>
      <label for="testDescription">Description (optional)</label>
      <input type="text" id="testDescription" placeholder="What this test covers">
      <button class="btn btn-accent" id="createTestSubmit" style="margin-top:14px;">Create draft</button>
      <span id="createTestError" style="color:var(--error); font-size:13px; margin-left:10px;"></span>
    </div>

    <div id="testList"></div>
  </div>

  <script src="/js/session-guard.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/class-view.js"></script>
</body>
</html>
