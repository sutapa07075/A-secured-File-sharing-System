<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Test</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="container">
    <div class="page-header">
      <div>
        <h1 id="testTitle">Loading…</h1>
        <p id="testMeta" style="font-family:-apple-system,sans-serif; font-size:13px; color:#8a8478; margin:4px 0 0;"></p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" id="publishBtn"></button>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-row" style="align-items:flex-end;">
        <div>
          <label for="bulkMarks">Set marks for ALL questions at once</label>
          <input type="number" id="bulkMarks" min="0.5" step="0.5" placeholder="e.g. 2">
        </div>
        <div style="flex:0;">
          <button class="btn btn-accent" id="bulkApply">Apply to all</button>
        </div>
      </div>
      <span id="bulkError" style="color:var(--error); font-size:13px;"></span>
    </div>

    <div id="questionList"></div>

    <div class="form-panel">
      <h3 style="margin-top:0;">Add a question</h3>
      <div class="form-row">
        <div>
          <label for="qType">Type</label>
          <select id="qType" style="width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;">
            <option value="text">Text answer</option>
            <option value="mcq_single">Multiple choice (single correct)</option>
          </select>
        </div>
        <div>
          <label for="qMarks">Marks</label>
          <input type="number" id="qMarks" value="1" min="0.5" step="0.5">
        </div>
      </div>
      <label for="qContent">Question</label>
      <input type="text" id="qContent" placeholder="Type the question text">

      <div id="mcqOptions" style="display:none; margin-top:10px;">
        <label>Options (mark the correct one)</label>
        <div id="optionRows"></div>
        <button class="btn btn-outline btn-small" id="addOptionBtn" type="button" style="margin-top:6px;">+ Add option</button>
      </div>

      <button class="btn btn-accent" id="addQuestionBtn" style="margin-top:16px;">Add question</button>
      <span id="addQuestionError" style="color:var(--error); font-size:13px; margin-left:10px;"></span>
    </div>
  </div>

  <script src="/js/session-guard.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/edit-test.js"></script>
</body>
</html>
