<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocFile ZK — Shared document</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-card" style="max-width:480px;">
      <div class="brand">
        <span class="brand-mark">D</span>
        <span class="brand-name">DocFile <span class="zk-badge">ZK</span></span>
      </div>
      <h1 id="statusTitle">Unlocking…</h1>
      <p class="sub" id="statusSub">Decrypting locally in your browser. The unlocking key was never sent to any server.</p>
      <div id="fileCard" hidden style="margin-top:20px;">
        <div class="doc-row">
          <div class="doc-meta">
            <div class="doc-name" id="fileName"></div>
            <div class="doc-sub" id="fileMeta"></div>
          </div>
        </div>
        <button id="downloadBtn" class="btn-primary" style="margin-top:16px; width:100%;">Download</button>
      </div>
    </div>
  </main>
  <script src="js/webcrypto.js"></script>
  <script src="js/toast.js"></script>
  <script>
    const ZK_API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? window.location.origin.replace(/:\d+$/, ':4000')
      : '';

    async function run() {
      const params = new URLSearchParams(window.location.search);
      const docId = params.get('doc');
      const code = params.get('code');
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const linkKeyRaw = fragment.get('key');

      const statusTitle = document.getElementById('statusTitle');
      const statusSub = document.getElementById('statusSub');

      if (!docId || !code || !linkKeyRaw) {
        statusTitle.textContent = 'Invalid link';
        statusSub.textContent = 'This share link is missing required parameters.';
        return;
      }

      try {
        const keyRes = await fetch(`${ZK_API_BASE}/api/zk/documents/${docId}/link-key?code=${encodeURIComponent(code)}`);
        if (!keyRes.ok) throw new Error((await keyRes.json()).error || 'Link expired or invalid');
        const info = await keyRes.json();

        const linkKey = await VaultCrypto.importLinkKeyFromB64(linkKeyRaw);
        const fileKey = await VaultCrypto.unwrapFileKeyForLink(info.wrappedKey, linkKey);
        const nameBuffer = await VaultCrypto.decryptBuffer(fileKey, VaultCrypto.fromB64(info.filenameCiphertext), info.filenameIv);
        const filename = new TextDecoder().decode(nameBuffer);

        statusTitle.textContent = 'Ready to download';
        statusSub.textContent = 'Decrypted successfully — nothing here was visible to the server.';
        document.getElementById('fileName').textContent = filename;
        document.getElementById('fileMeta').textContent = info.mimeType || '';
        document.getElementById('fileCard').hidden = false;

        document.getElementById('downloadBtn').addEventListener('click', async () => {
          const fileRes = await fetch(`${ZK_API_BASE}/api/zk/documents/${docId}/download?code=${encodeURIComponent(code)}`);
          if (!fileRes.ok) { toast('Download failed', { type: 'error' }); return; }
          const fileIv = fileRes.headers.get('X-File-Iv') || info.fileIv;
          const ciphertext = await fileRes.arrayBuffer();
          const plaintext = await VaultCrypto.decryptBuffer(fileKey, ciphertext, fileIv);
          const blob = new Blob([plaintext], { type: info.mimeType || 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
        });
      } catch (err) {
        statusTitle.textContent = 'Could not open document';
        statusSub.textContent = err.message || 'The link may have expired or been revoked.';
      }
    }
    run();
  </script>
</body>
</html>
