<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocFile — Your documents</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand" style="margin-bottom:24px;">
        <span class="brand-mark">D</span>
        <span class="brand-name">DocFile</span>
      </div>


      <nav class="sidebar-nav">
        <a href="dashboard" class="active">My documents</a>
        <a href="public">Public folder</a>
      </nav>
      <input type="file" id="fileInput" hidden multiple />
      <button id="newUploadBtn" class="btn-new">
        <span style="font-size:16px;">&#8593;</span> New upload
      </button>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser" hidden>
          <div class="sidebar-user-avatar" id="sidebarUserAvatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName"></div>
            <div class="sidebar-user-email" id="sidebarUserEmail"></div>
          </div>
        </div>
        <button id="logoutBtn" class="btn-ghost small">Sign out</button>
      </div>
    </aside>

    <main class="main-content" id="dropZone">
      <div class="section-head" style="margin-top:0;">
        <h2>Your documents</h2>
        <button id="refreshBtn" class="btn-ghost small">Refresh</button>
      </div>
      <div id="docList" class="doc-grid"></div>
      <p id="emptyState" class="empty-state" hidden>Nothing here yet — click "New upload" or drop a file anywhere on this page.</p>
    </main>
  </div>

  <!-- Full-page drag overlay -->
  <div id="dropOverlay" class="drop-overlay" hidden>
    <p>Drop files to upload</p>
  </div>

  <!-- Upload queue panel (Drive-style, bottom-right) -->
  <div id="uploadQueuePanel" class="upload-queue-panel" hidden>
    <div class="uqp-header">
      <span id="uqpTitle">Uploading…</span>
      <div class="uqp-header-actions">
        <button id="uqpMinimize" title="Minimize">&#8211;</button>
        <button id="uqpClose" title="Close">&#10005;</button>
      </div>
    </div>
    <div id="uqpList" class="uqp-list"></div>
  </div>

  <!-- Share modal -->
  <div id="shareModal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>Share "<span id="shareDocName"></span>"</h3>
        <button id="closeShareModal" class="btn-ghost small">Close</button>
      </div>
      <div class="modal-body">
        <div class="share-option">
          <h4>Anyone with the link</h4>
          <div class="row">
            <select id="linkRole"><option value="view">Can view</option><option value="edit">Can edit</option></select>
            <button id="createLinkBtn" class="btn-primary small">Create link</button>
          </div>
          <div id="linkResult" class="link-result" hidden>
            <input id="linkResultInput" readonly />
            <button id="copyLinkBtn" class="btn-ghost small">Copy</button>
          </div>
        </div>
        <div class="share-option">
          <h4>Invite a person</h4>
          <div class="row">
            <input id="granteeEmail" type="email" placeholder="name@company.com" />
            <button id="checkEmailBtn" class="btn-ghost small">Check</button>
          </div>
          <div id="granteeFound" class="link-result" hidden style="align-items:center;">
            <img id="granteeAvatar" src="" alt="" style="width:28px;height:28px;border-radius:50%;" />
            <span id="granteeName" style="flex:1;font-size:13px;"></span>
          </div>
          <div id="granteeNotFound" class="hint" hidden style="color:var(--warn);margin-top:8px;"></div>
          <div class="row" style="margin-top:10px;">
            <select id="granteeRole"><option value="view">Can view</option><option value="edit">Can edit</option></select>
            <button id="inviteBtn" class="btn-primary small" disabled>Invite</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Visibility modal (make public / make private) -->
  <div id="visibilityModal" class="modal-backdrop" hidden>
    <div class="modal" style="max-width:400px;">
      <div class="modal-head">
        <h3 id="visibilityModalTitle">Make public</h3>
        <button id="closeVisibilityModal" class="btn-ghost small">Close</button>
      </div>
      <div class="modal-body">
        <p class="hint" id="visibilityModalHint">A complete world of Information, Emerge in it</p>
        <input type="text" id="visibilityDescriptionInput" class="modal-input" placeholder="What does this file contain? (optional, shown in the public folder)" />
        <button id="visibilityConfirmBtn" class="btn-primary small" style="margin-top:14px;">Confirm</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
