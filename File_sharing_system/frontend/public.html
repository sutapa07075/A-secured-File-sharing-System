<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocFile — Public folder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand" style="margin-bottom:24px;">
        <span class="brand-mark">D</span>
        <span class="brand-name">DocFile</span>
      </div>

      <a href="dashboard" class="btn-new" style="text-decoration:none;">
        <span style="font-size:16px;">&#8593;</span> New upload
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard">My documents</a>
        <a href="public" class="active">Public folder</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser" hidden>
          <div class="sidebar-user-avatar" id="sidebarUserAvatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName"></div>
            <div class="sidebar-user-email" id="sidebarUserEmail"></div>
          </div>
        </div>
        <button id="logoutBtn" class="btn-ghost small">Sign out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="section-head">
        <h2>Public folder</h2>
        <button id="refreshBtn" class="btn-ghost small">Refresh</button>
      </div>
      <p class="hint" style="margin-bottom:22px;">
        An entire world of Documents is waiting for you!
      </p>
      <div id="docList" class="doc-grid"></div>
      <p id="emptyState" class="empty-state" hidden>No public files yet.</p>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/toast.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? window.location.origin.replace(/:\d+$/, ':4000') // local dev: frontend and backend on different ports
      : ''; // production: same-origin, routed to the real backend via the hosting platform's rewrites/proxy

    async function api(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, { credentials: 'include', ...opts });
      if (res.status === 401) {
        const refreshed = await fetch(`${API_BASE}/api/auth/refresh`, { method: 'POST', credentials: 'include' });
        if (refreshed.ok) return api(path, opts);
        window.location.href = '/';
        throw new Error('Not authenticated');
      }
      return res;
    }

    function formatBytes(bytes) {
      if (!bytes) return '—';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0, n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function thumbFallbackIcon(mimeType = '') {
      if (mimeType === 'application/pdf') return 'PDF';
      if (mimeType.startsWith('image/')) return 'IMG';
      if (mimeType.startsWith('video/')) return 'VID';
      if (mimeType.startsWith('audio/')) return 'AUD';
      return 'FILE';
    }

    async function generateThumbnail(doc, thumbEl) {
      if (doc.mimeType && doc.mimeType.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = `${API_BASE}/api/documents/${doc.id}/view`;
        img.alt = doc.filename;
        img.loading = 'lazy';
        thumbEl.innerHTML = '';
        thumbEl.appendChild(img);
        return;
      }
      if (doc.mimeType === 'application/pdf' && window.pdfjsLib) {
        try {
          const res = await api(`/api/documents/${doc.id}/view`);
          if (!res.ok) return;
          const buf = await res.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({ scale: 1 });
          const scale = 220 / viewport.width;
          const scaledViewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaledViewport }).promise;
          thumbEl.innerHTML = '';
          thumbEl.appendChild(canvas);
        } catch (err) {
          console.error('PDF thumbnail render failed for', doc.filename, err);
        }
      }
    }

    async function loadPublicDocuments() {
      const res = await api('/api/documents/public');
      if (!res.ok) return;
      const { documents } = await res.json();
      const docList = document.getElementById('docList');
      const emptyState = document.getElementById('emptyState');
      docList.innerHTML = '';
      emptyState.hidden = documents.length > 0;

      documents.forEach((doc) => {
        const card = document.createElement('div');
        card.className = 'doc-card';
        card.innerHTML = `
          <div class="doc-thumb" data-action="view">
            <span class="doc-thumb-icon">${thumbFallbackIcon(doc.mimeType)}</span>
          </div>
          <div class="doc-card-body">
            <div class="doc-card-name" data-action="view" title="${escapeHtml(doc.filename)}">${escapeHtml(doc.filename)}</div>
            ${doc.description ? `<div class="doc-card-sub" title="${escapeHtml(doc.description)}">${escapeHtml(doc.description)}</div>` : ''}
            <div class="doc-card-sub">${formatBytes(doc.sizeBytes)} · ${formatDate(doc.createdAt)}</div>
            <div class="doc-card-sub">by ${escapeHtml(doc.ownerName || doc.ownerEmail || 'someone')}</div>
          </div>
          <div class="doc-card-actions">
            <button data-action="view">View</button>
            <button data-action="download">Download</button>
          </div>
        `;
        card.querySelectorAll('[data-action="view"]').forEach((el) =>
          el.addEventListener('click', () => window.open(`reader?doc=${doc.id}&from=${encodeURIComponent('public')}`, '_blank'))
        );
        card.querySelector('[data-action="download"]').addEventListener('click', () => {
          window.location.href = `${API_BASE}/api/documents/${doc.id}/download`;
        });
        docList.appendChild(card);
        generateThumbnail(doc, card.querySelector('.doc-thumb'));
      });
    }

    async function loadSidebarUser() {
      const widget = document.getElementById('sidebarUser');
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (!res.ok) return;
        const user = await res.json();
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('sidebarUserName').textContent = name;
        document.getElementById('sidebarUserEmail').textContent = user.email;
        const avatarEl = document.getElementById('sidebarUserAvatar');
        avatarEl.innerHTML = user.avatarUrl ? `<img src="${user.avatarUrl}" alt="" />` : '';
        if (!user.avatarUrl) avatarEl.textContent = name.charAt(0).toUpperCase();
        widget.hidden = false;
      } catch {}
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPublicDocuments);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    loadPublicDocuments();
    loadSidebarUser();
  </script>
</body>
</html>
