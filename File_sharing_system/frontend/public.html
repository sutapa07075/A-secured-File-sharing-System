<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault — Public folder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9633;</span>
      <span class="brand-name">Vault</span>
    </div>
    <div class="row" style="gap:10px;">
      <a href="dashboard.html" class="btn-ghost small">My documents</a>
      <button id="logoutBtn" class="btn-ghost small">Sign out</button>
    </div>
  </header>

  <main class="dashboard">
    <div class="section-head" style="margin-top:0;">
      <h2>Public folder</h2>
      <button id="refreshBtn" class="btn-ghost small">Refresh</button>
    </div>
    <p class="hint" style="margin-bottom:20px;">
      Files anyone signed in to Vault has chosen to make public. Anyone with an account can view or download these.
    </p>
    <div id="docList" class="doc-list"></div>
    <p id="emptyState" class="empty-state" hidden>No public files yet.</p>
  </main>

  <script>
    const API_BASE = window.location.origin.replace(/:\d+$/, ':4000');

    async function api(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, { credentials: 'include', ...opts });
      if (res.status === 401) {
        const refreshed = await fetch(`${API_BASE}/api/auth/refresh`, { method: 'POST', credentials: 'include' });
        if (refreshed.ok) return api(path, opts);
        window.location.href = '/index.html';
        throw new Error('Not authenticated');
      }
      return res;
    }

    function formatBytes(bytes) {
      if (!bytes) return '—';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0, n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadPublicDocuments() {
      const res = await api('/api/documents/public');
      if (!res.ok) return;
      const { documents } = await res.json();
      const docList = document.getElementById('docList');
      const emptyState = document.getElementById('emptyState');
      docList.innerHTML = '';
      emptyState.hidden = documents.length > 0;

      documents.forEach((doc) => {
        const row = document.createElement('div');
        row.className = 'doc-row';
        row.style.alignItems = 'flex-start';
        row.innerHTML = `
          <span class="doc-icon" style="margin-top:2px;">&#128193;</span>
          <div class="doc-meta">
            <div class="doc-name">${escapeHtml(doc.filename)}</div>
            ${doc.description ? `<div class="doc-sub" style="margin-top:4px;">${escapeHtml(doc.description)}</div>` : ''}
            <div class="doc-sub" style="margin-top:4px;">
              ${formatBytes(doc.sizeBytes)} · uploaded ${formatDate(doc.createdAt)} · by ${escapeHtml(doc.ownerName || doc.ownerEmail || 'someone')}
            </div>
          </div>
          <div class="doc-actions">
            <button class="btn-ghost small" data-action="view">View</button>
            <button class="btn-ghost small" data-action="download">Download</button>
          </div>
        `;
        row.querySelector('[data-action="view"]').addEventListener('click', () => {
          window.open(`reader.html?doc=${doc.id}&from=${encodeURIComponent('public.html')}`, '_blank');
        });
        row.querySelector('[data-action="download"]').addEventListener('click', () => {
          window.location.href = `${API_BASE}/api/documents/${doc.id}/download`;
        });
        docList.appendChild(row);
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPublicDocuments);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    loadPublicDocuments();
  </script>
</body>
</html>
